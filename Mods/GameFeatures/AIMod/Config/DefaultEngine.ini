; AIMod AI interface (PLAN.md Phase 9): force loopback-only binding for
; its RPC port. Duplicates the same entry in the project-level
; Config/DefaultEngine.ini - that one only takes effect for Development
; Editor sessions run from this workspace, not the separately
; Alpakit-packaged/deployed mod the Steam client actually loads (live
; netstat check, 2026-08-24, showed 0.0.0.0:51902 with only the
; project-level entry in place). UE merges a plugin's own
; Config/Default*.ini files into the corresponding project config at
; startup, so this copy should reach the packaged deploy where the
; other one doesn't - NOT YET VERIFIED against a real Steam session,
; see docs/networking-research.md and docs/manual-verification.md.
; Port must match UAIModHttpServerSubsystem::ListenPort
; (Mods/GameFeatures/AIMod/Source/AIMod/Public/AIModHttpServerSubsystem.h).
[HTTPServer.Listeners]
+ListenerOverrides=(Port=51902,BindAddress=localhost)
