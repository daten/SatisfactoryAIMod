[project]
name = "satisfactory-ai-controller"
version = "0.1.0"
description = "External controller skeleton for the Satisfactory AI interface (PLAN.md Phase 8). No LLM dependency, no optimization solver, no game-control intelligence, no network client yet."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["satisfactory_ai*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
